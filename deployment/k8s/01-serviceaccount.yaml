apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagster
  namespace: data-platform
  annotations:
    # IRSA: the trust policy on this role hardcodes
    # system:serviceaccount:data-platform:dagster, so neither the name nor the
    # namespace may change. Grants the Dagster pods S3 access for compute logs
    # and for the s3_pickle IO manager.
    eks.amazonaws.com/role-arn: "${DAGSTER_ROLE_ARN}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse
  namespace: data-platform
  annotations:
    # IRSA for the warehouse itself, so it can read landed Parquet out of S3 with
    # the s3() table function instead of the code location pulling the file
    # through pandas. Same hardcoded-subject rule as above:
    # system:serviceaccount:data-platform:clickhouse is in the trust policy, so
    # neither the name nor the namespace may change.
    #
    # A separate role from dagster's on purpose — read-only, and only under
    # landing/. See aws_iam_role_policy.clickhouse_s3.
    eks.amazonaws.com/role-arn: "${CLICKHOUSE_ROLE_ARN}"
