apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-checkpoints
  namespace: data-platform
  labels:
    app: spark-consumer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      # Structured Streaming keeps offset and commit logs plus a little query
      # metadata, trimmed to spark.sql.streaming.minBatchesToRetain (100 by
      # default). Kilobytes per batch, so this is generous.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-consumer
  namespace: data-platform
  labels:
    app: spark-consumer
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. The checkpoint volume is
  # ReadWriteOnce, so a rolling update would leave the new pod Pending forever
  # waiting for a volume the outgoing pod still holds -- a deadlock that only
  # shows up on the second deploy, not the first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-consumer
  template:
    metadata:
      labels:
        app: spark-consumer
    spec:
      containers:
        - name: spark-consumer
          image: ${IMAGE_PREFIX}-spark-consumer:${IMAGE_TAG}
          env:
            # In-cluster broker (07-kafka.yaml), so this is the same literal
            # the compose stack uses rather than a rendered placeholder.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: bluesky_events
            - name: POSTGRES_HOST
              value: "${RDS_HOST}"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: dagster
            - name: POSTGRES_USER
              value: dagster
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres
                  key: DAGSTER_PG_PASSWORD
            - name: POSTGRES_TABLE
              value: bsky_records
            # Not /tmp. The path is the documentation: this is the consumer's
            # record of how far it has read, and losing it means resuming at
            # startingOffsets=latest and silently skipping everything published
            # while the pod was away. Kafka still holds those events; nothing
            # goes back for them.
            - name: CHECKPOINT_DIR
              value: /var/lib/spark/checkpoints/bsky_records
          volumeMounts:
            - name: checkpoints
              mountPath: /var/lib/spark/checkpoints
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: spark-checkpoints
