services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: "0.5"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    # Memory budget, measured rather than guessed. The Docker VM is 7.75 GiB;
    # everything else on the stack sits at ~1.4 GiB idle (kafka 0.7, etl 0.28,
    # web 0.11, ml 0.09, postgres 0.08, producer 0.06), the daemon adds ~0.3 and
    # spark_consumer is capped at 2g. Non-ClickHouse containers measure ~1.6 GiB
    # in steady state, so with spark's cap that is ~3.6 GiB spoken for and ~4 GiB
    # available here.
    #
    # 3g was tried first and was too tight: the dbt full refresh rebuilds the
    # marts from a 6.7M-row FINAL view with several models in flight at once,
    # individual queries measured at 1.68-1.85 GiB, and they collided with each
    # other against the 2.70 GiB ceiling a 3g container implies. That showed up
    # as intermittent MEMORY_LIMIT_EXCEEDED on dbt rather than as a crash --
    # which is the system working as intended, and the reason the number could
    # be corrected from a log line instead of from an outage.
    #
    # THE LIMIT IS THE POINT, not the number. ClickHouse reads its cgroup and
    # sizes max_server_memory_usage and the merges/mutations soft limit from it,
    # so with a limit an over-large query raises MEMORY_LIMIT_EXCEEDED -- a
    # failed run, retryable, with a stack trace naming the query. Without one it
    # sizes against the whole host, grows past what the VM can give, and the
    # kernel SIGKILLs it: exit 137, nothing in the error log, and every other
    # service failing behind it. That is what happened on 2026-08-03.
    mem_limit: 4g
    # A warehouse that dies should come back. Without this the OOM above turned
    # into 80 minutes of failed runs, because nothing restarted it.
    restart: unless-stopped
    environment:
      # Creates the database on first boot of an empty volume, so the analytics
      # API can connect before any pipeline has run. Matches the k8s StatefulSet.
      # CLICKHOUSE_DB only -- CLICKHOUSE_USER/PASSWORD would make the entrypoint
      # write its own file into users.d/ and fight the mounted users.xml.
      CLICKHOUSE_DB: analytics
    # Run as the clickhouse user rather than starting as root and dropping.
    # The entrypoint sets DO_CHOWN=0 when it is already non-root; as root it
    # runs `chown -R` over user_files_path, which recurses straight into the
    # read-only landing mount below and kills the container on `set -e`:
    #   chown: changing ownership of '.../user_files/landing': Read-only file system
    # The data volume is seeded from the image as 101:101, so this uid can
    # write it. (CLICKHOUSE_DO_NOT_CHOWN=1 is the equivalent lever if a stale
    # volume ever needs the root phase back.)
    user: "101:101"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # The landing zone, read-only, so ClickHouse can open a landed Parquet
      # itself via file() instead of it being pulled through the code location.
      # Same volume the etl code location writes at /app/landing; the path under
      # user_files is what landing_zone.warehouse_prefix names. Read-only because
      # the archive is immutable and the warehouse has no business writing to it.
      - landing_data:/var/lib/clickhouse/user_files/landing:ro
      - ./deployment/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cpus: "1.0"

  code_location_basic_ml:
    image: ajohnson0764/data-platform-ml:1.1.0
    environment:
      ENV: ${ENV:-dev}
      DAGSTER_GRPC_PORT: 4000
      DAGSTER_GRPC_HOST: 0.0.0.0
      DAGSTER_HOME: /dagster_home
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - dagster_home:/dagster_home
      - dagster_compute_logs:/dagster_compute_logs
      # The same volume the etl location writes landed Parquet into. This
      # location only uses the models/ prefix under it, but it needs the mount
      # for the same reason: runs execute inside this container, so without it
      # save_model writes the artifact to the container's own writable layer
      # and `make down` destroys a model the registry still points at.
      - landing_data:/app/landing
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - clickhouse
    mem_limit: 1g
    cpus: "1.0"

  code_location_etl:
    image: ajohnson0764/data-platform-etl:1.1.0
    environment:
      ENV: ${ENV:-dev}
      DAGSTER_GRPC_PORT: 4001
      DAGSTER_GRPC_HOST: 0.0.0.0
      DAGSTER_HOME: /dagster_home
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - dagster_home:/dagster_home
      - dagster_compute_logs:/dagster_compute_logs
      # The landing zone is the replay source for the warehouse, so unlike the
      # io manager's scratch space it must survive a container restart.
      - landing_data:/app/landing
    ports:
      - "4001:4001"
    depends_on:
      - postgres
      - clickhouse
    mem_limit: 1g
    cpus: "1.0"

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    mem_limit: 512m
    cpus: "0.5"

  kafka_producer:
    image: ajohnson0764/data-platform-kafka-producer:1.1.0
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bluesky_events
    volumes:
      # Holds the Jetstream cursor so a restart resumes where it left off
      # instead of skipping ahead to the live edge and losing the gap.
      - producer_state:/app/state
    depends_on:
      - kafka
    restart: on-failure
    mem_limit: 256m
    cpus: "0.25"

  spark_consumer:
    image: ajohnson0764/data-platform-spark-consumer:1.1.0
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bluesky_events
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dagster
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_TABLE: bsky_records
      # Not /tmp. This is the consumer's record of how far it has read: lose it
      # and Spark resumes at startingOffsets=latest, silently skipping every
      # event published while the container was gone. Kafka still holds them --
      # nothing goes back for them. A `docker restart` always survived (the
      # writable layer persists); `up --build`, `down`/`up` and any image change
      # did not, which is the case this volume closes.
      CHECKPOINT_DIR: /var/lib/spark/checkpoints/bsky_records
    volumes:
      - spark_checkpoints:/var/lib/spark/checkpoints
    depends_on:
      - kafka
      - postgres
    # Same reason as the clickhouse service above: on 2026-08-02 this exited(1)
    # and stayed dead for six hours, so ingest silently stopped while every other
    # container looked healthy. A consumer that dies should come back and let the
    # checkpoint resume it -- which is the whole point of checkpointed offsets.
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"

  web:
    image: ajohnson0764/data-platform-webserver:1.1.0
    environment:
      DAGSTER_HOME: /dagster_home
      ENV: dev
    volumes:
      - dagster_home:/dagster_home
      - ./deployment/dagster.yaml:/dagster_home/dagster.yaml:ro
      - dagster_compute_logs:/dagster_compute_logs
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - code_location_basic_ml
      - code_location_etl
    mem_limit: 256m
    cpus: "0.25"

  daemon:
    image: ajohnson0764/data-platform-daemon:1.1.0
    environment:
      DAGSTER_HOME: /dagster_home
      ENV: dev
    volumes:
      - dagster_home:/dagster_home
      - ./deployment/dagster.yaml:/dagster_home/dagster.yaml:ro
      - dagster_compute_logs:/dagster_compute_logs
    depends_on:
      - postgres
      - code_location_basic_ml
      - code_location_etl
    mem_limit: 256m
    cpus: "0.25"

  analytics_api:
    image: ajohnson0764/data-platform-analytics-api:1.1.0
    profiles: ["nl2sql"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USER: analytics_ro
      CLICKHOUSE_PASSWORD: analytics_ro
    ports:
      - "8000:8000"
      - "7860:7860"
    depends_on:
      - clickhouse
    mem_limit: 512m
    cpus: "0.5"

volumes:
  dagster_home: {}
  dagster_compute_logs: {}
  postgres_data: {}
  clickhouse_data: {}
  landing_data: {}
  producer_state: {}
  spark_checkpoints: {}   # spark's kafka offsets; see CHECKPOINT_DIR
