# CI gates what can be checked without infrastructure: the unit suite, a lint
# pass, the terraform configuration, and whether the deployment manifests still
# parse. Everything here runs on a bare runner in under two minutes.
#
# What is deliberately absent, and why, is at the bottom of this file.

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A branch only needs its newest commit checked; a push supersedes whatever is
# still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Both versions are worth seeing when one breaks.
      fail-fast: false
      matrix:
        # The images build on 3.11; 3.12 is what the suite is developed
        # against. Running both keeps that gap from going unnoticed.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      # The rule selection lives in ruff.toml and is narrower than ruff's
      # default on purpose: only families the existing code already passes.
      # A linter introduced after 4.5k lines were written either gets scoped
      # to what it can enforce today or it gets ignored, and an ignored red
      # check is worse than no check.
      - run: ruff check .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory until it has gone green once. `terraform validate` resolves
    # providers from the registry and exercises paths nobody runs outside an
    # apply, so a first failure here should not block a commit that only
    # touched Python. Drop this line once the job has passed.
    continue-on-error: true
    defaults:
      run:
        working-directory: deployment/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned so a terraform release cannot change the fmt rules under us.
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: there is no backend block and no AWS credentials here.
      # This resolves providers and type-checks the configuration, nothing more.
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

  yaml:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Syntax only. A manifest that does not parse is a deploy that fails
      # after `kubectl apply` has already accepted half the set, which is the
      # expensive way to find a stray tab. Schema validation would need a live
      # cluster or a pinned CRD bundle and is a separate concern.
      - name: Parse deployment manifests
        run: |
          python - <<'PY'
          import glob
          import sys

          import yaml

          paths = sorted(
              set(glob.glob("deployment/k8s/*.yaml"))
              | set(glob.glob("deployment/*.yaml"))
              | {"docker-compose.yaml"}
          )
          if not paths:
              sys.exit("no manifests found -- the globs are wrong, not the manifests")

          failures = []
          for path in paths:
              try:
                  with open(path) as handle:
                      documents = list(yaml.safe_load_all(handle))
              except (OSError, yaml.YAMLError) as exc:
                  failures.append(f"{path}: {exc}")
              else:
                  print(f"ok    {path} ({len(documents)} document(s))")

          for failure in failures:
              print(f"FAIL  {failure}")
          sys.exit(1 if failures else 0)
          PY

      # The two aws ConfigMaps are generated from the code locations' own
      # config.aws.yaml, because on EKS the ConfigMap is what the pod reads and
      # a hand-maintained second copy drifts silently -- it had, by several
      # keys. Nothing stops someone editing the manifest directly, so the guard
      # is that CI notices.
      - name: Check generated ConfigMaps are current
        run: python deployment/k8s/render_config.py --check

# Not here on purpose:
#
#   docker build      -- eight images, multi-arch, and pushing them needs
#                        registry credentials. push_images.sh already does it.
#   dagster definitions validate
#                     -- needs all three code locations installed plus the env
#                        that config.py resolves at import time.
#   dbt parse         -- needs dbt-clickhouse and DBT_CLICKHOUSE_PASSWORD set.
#                        The etl_pipeline image already parses at build time,
#                        which is where a broken model surfaces today.
